[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aix-page"
version = "1.0.0"
description = "Search Ads experimentation, causal analysis, and safe policy evaluation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<3", "pyarrow>=17,<22", "duckdb>=1.1,<2",
  "scipy>=1.14,<2", "scikit-learn>=1.5,<2", "statsmodels>=0.14,<1",
  "matplotlib>=3.9,<4", "PyYAML>=6,<7", "pydantic>=2.9,<3", "joblib>=1.4,<2"
]

[project.optional-dependencies]
gpu = ["xgboost==3.4.1", "torch==2.11.0"]
dev = ["pytest>=9,<10", "pytest-cov>=5,<8", "hypothesis>=6,<7", "ruff>=0.6,<1", "mypy>=2,<3", "pandas-stubs>=2.3.3,<2.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --basetemp=.pytest_tmp"
markers = ["statistical: Monte Carlo or statistical validation"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["data/", "public_evidence/", "reports/"]

[tool.coverage.run]
source = ["aix_page"]
